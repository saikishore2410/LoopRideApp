name: LoopRideApp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: javac -d . LoopRideApp.java

      - name: Start server
        run: |
          java project.LoopRideApp 18080 > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

      - name: Smoke test endpoints
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/index.html)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/health)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/rider)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/driver)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/does-not-exist)" = "404"
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status": "UP"'
          curl -fsS http://127.0.0.1:18080/api/rider | grep -q '"role": "rider"'
          curl -fsS http://127.0.0.1:18080/api/driver | grep -q '"role": "driver"'

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
          cat server.log || true
