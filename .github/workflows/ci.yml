name: LoopRideApp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: |
          set -eu
          javac -Xlint:all -d . LoopRideApp.java
          test -f project/LoopRideApp.class
      - name: Start server
        run: |
          set -eu
          java project.LoopRideApp 18080 > server.log 2>&1 &
          echo $! > server.pid
          ready=0
          for i in {1..20}; do
            if curl --silent --show-error --fail http://127.0.0.1:18080/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat server.log; exit 1; fi
      - name: Test routes, response bodies, headers, and methods
        run: |
          set -eu
          base=http://127.0.0.1:18080
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          assert_status() {
            expected="$1"; shift
            actual="$(curl --silent --show-error -o "$tmp/body" -D "$tmp/headers" -w '%{http_code}' "$@")"
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected but received $actual for $*"
              cat "$tmp/body"; exit 1
            fi
          }
          assert_status 200 "$base/"
          grep -qi 'Content-Type: text/html' "$tmp/headers"
          grep -q 'Rider App' "$tmp/body"
          assert_status 200 "$base/index.html"
          grep -q 'Driver Dashboard' "$tmp/body"
          assert_status 200 "$base/api/health"
          grep -qi 'Content-Type: application/json' "$tmp/headers"
          grep -q '"status": "UP"' "$tmp/body"
          grep -q '"application": "Loop Ride App"' "$tmp/body"
          assert_status 200 "$base/api/rider"
          grep -q '"role": "rider"' "$tmp/body"
          grep -q '"status": "ready"' "$tmp/body"
          assert_status 200 "$base/api/driver"
          grep -q '"role": "driver"' "$tmp/body"
          grep -q '"online": false' "$tmp/body"
          grep -q '"status": "offline"' "$tmp/body"
          assert_status 404 "$base/api/does-not-exist"
          grep -qi 'Content-Type: application/json' "$tmp/headers"
          grep -q '"error": "Endpoint not found"' "$tmp/body"
          assert_status 404 "$base/unknown-page"
          grep -q '"error": "Endpoint not found"' "$tmp/body"
          for method in POST PUT PATCH DELETE; do
            assert_status 405 -X "$method" "$base/api/health"
            grep -qi 'Allow: GET' "$tmp/headers"
            grep -q '"error": "Method not allowed"' "$tmp/body"
          done
          status="$(curl --silent --show-error -I -o /dev/null -w '%{http_code}' "$base/api/health")"
          test "$status" = "405"
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
          cat server.log || true

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Compile and start app
        run: |
          set -eu
          javac -d . LoopRideApp.java
          java project.LoopRideApp 18080 > server.log 2>&1 &
          echo $! > server.pid
          ready=0
          for i in {1..20}; do
            if curl --silent --show-error --fail http://127.0.0.1:18080/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat server.log; exit 1; fi
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Stop app
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
          cat server.log || true

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag loop-ride-app:test .
      - name: Run container and test deployed HTTP endpoints
        run: |
          set -eu
          docker run --detach --rm --name loop-ride-app-test -p 18081:10000 loop-ride-app:test
          cleanup() { docker stop loop-ride-app-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for i in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:18081/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs loop-ride-app-test; exit 1; fi
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/api/health)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/api/not-found)" = "404"
          curl --silent --show-error http://127.0.0.1:18081/api/health | grep -q '"status": "UP"'
